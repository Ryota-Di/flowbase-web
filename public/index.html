<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowBase | Checkout</title>
  <!-- ui=v14: local demo cache-busting for refreshed images. -->
  <link rel="stylesheet" href="/style.css?ui=v14">
</head>
<body>
  <div class="site-container">
    <header class="topbar" id="environment-bar" data-environment="unknown" aria-label="デモ環境情報">
      <div class="brand">
        <span class="brand-symbol" aria-hidden="true">F</span>
        <div class="brand-copy"><strong>FlowBase</strong><span>CHECKOUT DEMO</span></div>
      </div>
      <div class="release-meta">
        <div class="meta-group"><span class="meta-title">ENVIRONMENT</span><strong class="environment-pill" id="environment-name">確認中</strong></div>
        <div class="meta-group"><span class="meta-title">VERSION</span><strong class="version-pill" id="app-version">--</strong></div>
      </div>
    </header>

    <main class="checkout-body">
      <div class="page-heading">
        <span class="section-kicker">YOUR ORDER</span>
        <h1>ご購入手続き</h1>
        <p>選択した商品と、ご購入の流れをご確認ください。</p>
      </div>

      <section class="product-card" aria-label="商品情報">
        <div class="product-placeholder" aria-hidden="true">🎧</div>
        <div class="product-description">
          <span class="product-category">AUDIO / HEADPHONES</span>
          <strong>デモ用ヘッドフォン</strong>
          <span class="product-subtext">ワイヤレスオーディオ・サンプル商品</span>
        </div>
        <strong class="price">¥12,800</strong>
      </section>

      <section class="checkout-card" aria-label="購入フロー">
        <div class="checkout-title"><h2>購入方法</h2><span class="feature-chip">機能比較デモ</span></div>
        <p class="feature-heading" id="feature">読み込み中…</p>
        <div class="flow-preview" id="flow-preview" aria-label="購入手続きの流れ"></div>
        <button id="next" type="button">読み込み中…</button>
        <p class="result" id="result" aria-live="polite">未購入</p>
      </section>
      <footer>このページはデモ用です。実際の決済・個人情報送信は行いません。</footer>
    </main>
  </div>
  <script src="/environment-banner.js?ui=v14" defer></script>
  <script src="/main.js?ui=v14" defer></script>
</body>
</html>
