name: Application CI and image publishing
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Source and syntax checks
        run: |
          python3 tests/test_source.py
          node --check public/main.js
      - name: Docker build and live HTTP test
        run: |
          docker build -t flowbase-web:ci .
          docker run -d --name flowbase-smoke -p 127.0.0.1:19090:8080 flowbase-web:ci
          trap 'docker rm -f flowbase-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:19090/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs flowbase-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:19090/version.json | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["version"] in ("v1","v2")'
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # pinned
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define lowercase GHCR name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowbase-web" >> "$GITHUB_OUTPUT"
      - name: Publish immutable commit-specific tag
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # pinned
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
